   {kind:'Shinkansen',date:'20 set',route:'Tóquio → Kyoto',time:'Nozomi 33 · 12:30 → 14:44',tags:['Green','Car. 9','14-A/B'],dot:'#2F5AA8'},
   {kind:'Shinkansen',date:'23 set',route:'Kyoto → Osaka',time:'Nozomi 137 · 11:33',tags:['Car. 2','18-D/E','¥6.560'],dot:'#2F5AA8'},

  ];

    toquio:{s:'#C1D3F4',l:'#DEE7FD',d:'#6D93D4',deep:'#2F5AA8',deepHi:'#24467F',n:'Tóquio'},
    kyoto:{s:'#A9CFBE',l:'#D3E5DD',d:'#5F9A85',deep:'#356857',deepHi:'#274E41',n:'Kyoto'},
    osaka:{s:'#F2C9A4',l:'#FBE3CE',d:'#D89154',deep:'#A2591A',deepHi:'#7F4513',n:'Osaka'}
  };
  var CC = ['toquio','toquio','toquio','toquio','toquio','toquio','kyoto','kyoto','kyoto','osaka','osaka','osaka'];
  var ISO = ['2026-09-14','2026-09-15','2026-09-16','2026-09-17','2026-09-18','2026-09-19','2026-09-20','2026-09-21','2026-09-22','2026-09-23','2026-09-24','2026-09-25'];
  // Barras alinhadas com as bolas dos dias (36px + 8px de intervalo = 44px por dia).
  function BAR(from, to) { return { left: (from * 44) + 'px', width: ((to - from + 1) * 44 - 8) + 'px' }; }
  var SPANS = [
    Object.assign({ k:'toquio', color:'#C1D3F4', top:'0px' }, BAR(0, 5)),
    Object.assign({ k:'kyoto', color:'#A9CFBE', top:'0px' }, BAR(6, 8)),
    Object.assign({ k:'osaka', color:'#F2C9A4', top:'0px' }, BAR(9, 11))
  ];

  var state = { tab: 'hoje', day: 0, det: null, q: '', sheetY: 0 };

  // Populated fresh on every render(); event delegation looks actions up by index.
  var live = { days: [], blocks: [], results: [], next: null, tabs: [] };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setState(patch) { Object.assign(state, patch); render(); }

  function buildDays(di) {
    return DAYS.map(function (d, i) {
      var selected = i === di;
      return {
        n: d.n, date: d.date, city: d.city, title: d.title,
        chip: d.date.replace(' set', ''),
        bg: selected ? '#201e1d' : '#ebddc5',
        fg: selected ? '#fff6ef' : '#645c50',
        cardBg: '#ebddc5', cardHi: '#eee7db',
        idx: i
      };
    });
  }

  function buildBlocks(day) {
    return day.blocks.map(function (b) {
      return {
        label: b.label,
        items: b.items.map(function (it) {
          return Object.assign({}, it, { dot: DOT_A[it.k] || '#5F9A85' });
        })
      };
    });
  }

  function detailFor(it, day, city) {
    return {
      n: it.n, d: it.d, k: it.k,
      kindLabel: KIND[it.k] || 'Ponto',
      when: it.t || day.date,
      tagBg: city.s, tagFg: '#201e1d',
      deep: city.deep, deepHi: city.deepHi
    };
  }

  function computeNext(di, blocks, flat, day) {
    var now = new Date();
    var todayISO = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var todayIdx = ISO.indexOf(todayISO);
    var mins = now.getHours() * 60 + now.getMinutes();
    function toMin(t) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
      return m ? (+m[1] * 60 + +m[2]) : null;
    }
    var next = flat[0] || {}, label = 'Primeiro do dia';
    if (todayIdx === di) {
      var upcoming = flat.find(function (it) { var m = toMin(it.t); return m !== null && m > mins; });
      var h = now.getHours();
      var period = h < 10 ? 'Pequeno-almoço' : h < 12 ? 'Manhã' : h < 15 ? 'Almoço' : h < 18.5 ? 'Tarde' : 'Jantar';
      var blk = blocks.find(function (b) { return b.label === period; }) || blocks.find(function (b) { return b.label === 'Noite'; });
      if (upcoming) { next = upcoming; label = 'A seguir · ' + upcoming.t; }
      else if (blk && blk.items.length) { next = blk.items[0]; label = 'Agora · ' + blk.label.toLowerCase(); }
      else { next = flat[flat.length - 1] || next; label = 'Último do dia'; }
    } else if (todayIdx === -1) {
      var dd = Math.round((new Date(ISO[di]) - new Date(todayISO)) / 86400000);
      label = dd > 0 ? 'Faltam ' + dd + ' dias · começa por' : 'Primeiro do dia';
    }
    return { item: next, label: label };
  }

  function searchResults(q) {
    q = (q || '').trim().toLowerCase();
    if (q.length < 2) return [];
    var out = [];
    DAYS.forEach(function (d, i) {
      d.blocks.forEach(function (b) {
        b.items.forEach(function (it) {
          if ((it.n + ' ' + (it.d || '') + ' ' + d.city + ' ' + d.date).toLowerCase().indexOf(q) !== -1) {
            out.push({ n: it.n, where: 'Dia ' + d.n + ' · ' + d.date + ' · ' + b.label, dot: DOT_A[it.k] || '#5F9A85', dayIdx: i, item: it, dayObj: d });
          }
        });
      });
    });
    return out.slice(0, 20);
  }

  function render() {
    var city = CITY[CC[state.day]];
    var day = DAYS[state.day];
    var days = buildDays(state.day);
    live.days = days;

    var blocks = buildBlocks(day);
    live.blocks = blocks;
    var flat = blocks.reduce(function (a, b) { return a.concat(b.items); }, []);
    var stops = flat.filter(function (it) { return it.k !== 'hotel'; }).map(function (it, i) {
      return { i: i + 1, n: it.n.length > 34 ? it.n.slice(0, 32) + '…' : it.n, d: it.t || '' };
    });
    var food = flat.filter(function (it) { return it.k === 'food' || it.k === 'cafe'; });

    var nextInfo = computeNext(state.day, blocks, flat, day);
    live.next = detailFor(nextInfo.item, day, city);
    live.next.n = nextInfo.item.n; live.next.d = nextInfo.item.d; live.next.label = nextInfo.label;

    var results = searchResults(state.q);
    live.results = results;
    var searching = results.length > 0 || (state.q || '').trim().length >= 2;
    var noResults = searching && results.length === 0;

    var tabs = TABS.map(function (t) {
      var id = t[0], label = t[1];
      var active = state.tab === id && !searching;
      return { id: id, label: label, bg: active ? '#201e1d' : 'transparent', fg: active ? '#fff6ef' : '#645c50' };
    });
    live.tabs = tabs;

    var det = state.det;

    var html = '';
    html += '<div style="padding:calc(env(safe-area-inset-top) + 18px) 22px 12px;background:#f5ead8">';
    html += '<span style="font:700 11px/1 Figtree,system-ui;letter-spacing:.14em;text-transform:uppercase;color:' + city.deep + '">Dia ' + esc(day.n) + ' · ' + esc(day.date) + '</span>';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 2px">';
    html += '<h1 style="margin:0;font:400 32px/1.05 Caprasimo,system-ui;color:#201e1d">' + esc(day.city) + '</h1>';
    html += '<div style="flex:none;display:flex;align-items:center;gap:6px;background:#ebddc5;border-radius:999px;padding:6px 10px;width:128px">';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#82796a" stroke-width="2.75" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.2-4.2"></path></svg>';
    html += '<input id="searchInput" type="text" value="' + esc(state.q) + '" style="flex:1;min-width:0;border:0;background:transparent;outline:none;font:500 12.5px/1.2 Figtree,system-ui;color:#201e1d">';
    if (searching) html += '<button type="button" data-action="clear-search" style="flex:none;border:0;background:transparent;cursor:pointer;padding:0;font:700 13px/1 Figtree,system-ui;color:' + city.deep + '">×</button>';
    html += '</div></div>';
    html += '<div style="font:500 13.5px/1.35 Figtree,system-ui;color:#645c50">' + esc(day.dow) + ' · ' + esc(day.title) + '</div>';
    html += '<div style="overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;padding:14px 22px 2px;margin:0 -22px"><div style="width:520px">';
    html += '<div style="display:flex;gap:8px">';
    days.forEach(function (d, i) {
      html += '<button type="button" data-action="pick-day" data-idx="' + i + '" style="flex:none;border:0;cursor:pointer;border-radius:999px;width:36px;height:36px;font:600 12px/1 Figtree,system-ui;background:' + d.bg + ';color:' + d.fg + '">' + esc(d.chip) + '</button>';
    });
    html += '</div>';
    html += '<div style="position:relative;height:3px;margin-top:9px">';
    SPANS.forEach(function (s) {
      html += '<div style="position:absolute;top:' + s.top + ';left:' + s.left + ';width:' + s.width + ';height:3px;border-radius:999px;background:' + s.color + '"></div>';
    });
    html += '</div></div></div>';
    html += '</div>';

    html += '<div style="flex:1;overflow:auto;padding:4px 22px 18px">';

    if (searching) {
      html += '<div style="display:flex;flex-direction:column;gap:8px;padding-top:6px">';
      results.forEach(function (r, i) {
        html += '<button type="button" class="card" data-action="search-go" data-idx="' + i + '" style="text-align:left;width:100%;border:0;cursor:pointer;background:#ebddc5;border-radius:18px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 1px 2px rgba(46,43,37,.14)">';
        html += '<span style="flex:none;width:11px;height:11px;border-radius:999px;margin-top:4px;background:' + r.dot + '"></span>';
        html += '<span style="flex:1;min-width:0"><span style="display:block;font:700 14px/1.3 Figtree,system-ui">' + esc(r.n) + '</span>';
        html += '<span style="display:block;margin-top:3px;font:500 11.5px/1.4 Figtree,system-ui;color:#645c50">' + esc(r.where) + '</span></span></button>';
      });
      if (noResults) html += '<div style="padding:26px 4px;font:500 13px/1.5 Figtree,system-ui;color:#645c50">Nada encontrado. Tenta “sushi”, “Kyoto”, “Shinkansen” ou “22 set”.</div>';
      html += '</div>';
    } else if (state.tab === 'hoje') {
      html += '<div style="background:' + city.s + ';color:#201e1d;border-radius:28px;padding:18px 20px 16px;box-shadow:0 3px 10px rgba(46,43,37,.16);margin-bottom:18px">';
      html += '<div style="font:700 10.5px/1 Figtree,system-ui;letter-spacing:.16em;text-transform:uppercase;color:#474238">' + esc(live.next.label) + '</div>';
      html += '<div style="margin-top:8px;font:400 24px/1.15 Caprasimo,system-ui">' + esc(live.next.n) + '</div>';
      html += '<div style="margin-top:6px;font:500 13px/1.4 Figtree,system-ui;color:#474238">' + esc(live.next.d || '') + '</div>';
      html += '<div style="display:flex;gap:10px;margin-top:14px">';
      html += '<button type="button" style="flex:1;border:0;cursor:pointer;border-radius:999px;padding:12px 16px;background:' + city.deep + ';color:#ffffff;font:700 13.5px/1 Figtree,system-ui">Navegar</button>';
      html += '<button type="button" data-action="open-next" style="border:1.5px solid rgba(32,30,29,.35);background:transparent;cursor:pointer;border-radius:999px;padding:12px 18px;color:#201e1d;font:600 13.5px/1 Figtree,system-ui">Detalhe</button>';
      html += '</div></div>';
      blocks.forEach(function (b, bi) {
        html += '<div style="margin-bottom:18px">';
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="font:700 11px/1 Figtree,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#645c50">' + esc(b.label) + '</span><span style="flex:1;height:1px;background:rgba(32,30,29,.12)"></span></div>';
        html += '<div style="display:flex;flex-direction:column;gap:10px">';
        b.items.forEach(function (it, ii) {
          html += '<button type="button" class="card" data-action="open-item" data-block="' + bi + '" data-item="' + ii + '" style="text-align:left;width:100%;border:0;cursor:pointer;background:#ebddc5;border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 2px rgba(46,43,37,.14)">';
          html += '<span style="flex:none;width:12px;height:12px;border-radius:999px;margin-top:4px;background:' + it.dot + '"></span>';
          html += '<span style="flex:1;min-width:0"><span style="display:block;font:700 14.5px/1.3 Figtree,system-ui;color:#201e1d">' + esc(it.n) + '</span>';
          html += '<span style="display:block;margin-top:3px;font:400 12.5px/1.45 Figtree,system-ui;color:#645c50">' + esc(it.d || '') + '</span></span>';
          html += '<span style="flex:none;font:700 11.5px/1 Figtree,system-ui;color:' + city.deep + ';padding-top:3px">' + esc(it.t || '') + '</span>';
          html += '</button>';
        });
        html += '</div></div>';
      });
    } else if (state.tab === 'dias') {
      html += '<div style="display:flex;flex-direction:column;gap:10px;padding-top:6px">';
      days.forEach(function (d, i) {
        html += '<button type="button" class="card" data-action="pick-day" data-idx="' + i + '" style="text-align:left;border:0;cursor:pointer;background:' + d.cardBg + ';border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(46,43,37,.14)">';
        html += '<span style="flex:none;width:44px;height:44px;border-radius:999px;background:' + d.bg + ';color:' + d.fg + ';display:flex;align-items:center;justify-content:center;font:400 17px/1 Caprasimo,system-ui">' + esc(d.n) + '</span>';
        html += '<span style="flex:1;min-width:0"><span style="display:block;font:700 14.5px/1.25 Figtree,system-ui">' + esc(d.date) + ' · ' + esc(d.city) + '</span>';
        html += '<span style="display:block;margin-top:2px;font:400 12.5px/1.4 Figtree,system-ui;color:#645c50">' + esc(d.title) + '</span></span></button>';
      });
      html += '</div>';
    } else if (state.tab === 'mapa') {
      html += '<div style="border-radius:28px;overflow:hidden;background:#eee7db;box-shadow:0 1px 2px rgba(46,43,37,.14);margin-top:6px">';
      html += '<div style="height:230px;background:repeating-linear-gradient(135deg,#e1eecc 0 12px,#eee7db 12px 24px);display:flex;align-items:center;justify-content:center">';
      html += '<span style="font:500 11.5px/1 ui-monospace,Menlo,monospace;color:#56633f;background:#f9f4ed;border-radius:999px;padding:8px 14px">mapa offline do dia</span></div>';
      html += '<div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px">';
      stops.forEach(function (s) {
        html += '<div style="display:flex;gap:12px;align-items:center">';
        html += '<span style="flex:none;width:26px;height:26px;border-radius:999px;background:' + city.deep + ';color:#ffffff;display:flex;align-items:center;justify-content:center;font:700 12px/1 Figtree,system-ui">' + s.i + '</span>';
        html += '<span style="flex:1;min-width:0;font:600 13.5px/1.3 Figtree,system-ui">' + esc(s.n) + '</span>';
        html += '<span style="font:500 11.5px/1 Figtree,system-ui;color:#645c50">' + esc(s.d) + '</span></div>';
      });
      html += '</div></div>';
    } else if (state.tab === 'comer') {
      html += '<div style="padding-top:6px;display:flex;flex-direction:column;gap:10px">';
      html += '<div style="font:700 11px/1 Figtree,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#645c50;margin-bottom:2px">Reservas confirmadas</div>';
      RESERVAS.forEach(function (r) {
        html += '<div style="background:#ebddc5;border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(46,43,37,.14)">';
        html += '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><span style="font:700 14.5px/1.3 Figtree,system-ui">' + esc(r.n) + '</span>';
        html += '<span style="flex:none;background:#c67139;color:#fff6ef;border-radius:999px;padding:5px 10px;font:700 11px/1 Figtree,system-ui">' + esc(r.h) + '</span></div>';
        html += '<div style="margin-top:5px;font:400 12.5px/1.45 Figtree,system-ui;color:#645c50">' + esc(r.d) + '</div></div>';
      });
      html += '<div style="font:700 11px/1 Figtree,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#645c50;margin:14px 0 2px">Refeições dia ' + esc(day.date.split(' ')[0]) + '</div>';
      food.forEach(function (f) {
        html += '<div style="background:#ebddc5;border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(46,43,37,.14)">';
        html += '<div style="font:700 14.5px/1.3 Figtree,system-ui">' + esc(f.n) + '</div>';
        html += '<div style="margin-top:4px;font:400 12.5px/1.45 Figtree,system-ui;color:#645c50">' + esc(f.d || '') + '</div></div>';
      });
      html += '</div>';
    } else if (state.tab === 'bilhetes') {
      html += '<div style="padding-top:6px;display:flex;flex-direction:column;gap:12px">';
      BILHETES.forEach(function (t) {
        html += '<div style="background:#ebddc5;border-radius:24px;padding:16px;box-shadow:0 1px 2px rgba(46,43,37,.14)">';
        html += '<div style="display:flex;align-items:center;gap:9px"><span style="width:10px;height:10px;border-radius:999px;background:' + t.dot + '"></span>';
        html += '<span style="font:700 10.5px/1 Figtree,system-ui;letter-spacing:.14em;text-transform:uppercase;color:#645c50">' + esc(t.kind) + ' · ' + esc(t.date) + '</span></div>';
        html += '<div style="margin-top:9px;font:400 20px/1.15 Caprasimo,system-ui">' + esc(t.route) + '</div>';
        html += '<div style="margin-top:6px;font:500 13px/1.4 Figtree,system-ui;color:#645c50">' + esc(t.time) + '</div>';
        html += '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:7px">';
        t.tags.forEach(function (tag) {
          html += '<span style="background:#f0fae1;color:#3d472b;border-radius:999px;padding:6px 11px;font:600 11.5px/1 Figtree,system-ui">' + esc(tag) + '</span>';
        });
        html += '</div></div>';
      });
      html += '</div>';
    }

    html += '</div>';

    html += '<div style="flex:none;display:flex;gap:4px;padding:10px 12px calc(env(safe-area-inset-bottom) + 14px);background:#ebddc5;border-top:1px solid rgba(32,30,29,.08)">';
    tabs.forEach(function (t, i) {
      html += '<button type="button" data-action="switch-tab" data-idx="' + i + '" style="flex:1;border:0;cursor:pointer;border-radius:999px;padding:10px 4px;background:' + t.bg + ';color:' + t.fg + ';font:700 11.5px/1 Figtree,system-ui">' + esc(t.label) + '</button>';
    });
    html += '</div>';

    if (det) {
      html += '<div id="sheetBackdrop" style="position:absolute;inset:0;background:rgba(32,30,29,.4);display:flex;align-items:flex-end;z-index:80">';
      html += '<div id="sheetPanel" style="width:100%;background:#f9f4ed;border-radius:28px 28px 0 0;padding:22px 22px 40px;box-shadow:0 12px 32px rgba(46,43,37,.22);transform:translateY(' + (state.sheetY || 0) + 'px);touch-action:none">';
      html += '<button type="button" data-action="close-sheet" style="display:block;width:56px;height:22px;border:0;background:transparent;cursor:grab;margin:0 auto 8px;padding:0"><span style="display:block;width:44px;height:5px;border-radius:999px;background:#dcd3c4;margin:6px auto 0"></span></button>';
      html += '<span style="display:inline-block;background:' + det.tagBg + ';color:' + det.tagFg + ';border-radius:999px;padding:6px 12px;font:700 11px/1 Figtree,system-ui;letter-spacing:.1em;text-transform:uppercase">' + esc(det.kindLabel) + '</span>';
      html += '<h2 style="margin:12px 0 0;font:400 26px/1.1 Caprasimo,system-ui">' + esc(det.n) + '</h2>';
      html += '<p style="margin:10px 0 0;font:400 14px/1.5 Figtree,system-ui;color:#474238">' + esc(det.d || '') + '</p>';
      html += '<div style="margin-top:8px;font:600 12.5px/1.4 Figtree,system-ui;color:' + det.deep + '">' + esc(det.when) + '</div>';
      html += '<div style="display:flex;gap:10px;margin-top:20px">';
      html += '<button type="button" style="flex:1;border:0;cursor:pointer;border-radius:999px;padding:14px;background:' + det.deep + ';color:#ffffff;font:700 14px/1 Figtree,system-ui">Abrir no Google Maps</button>';
      html += '<button type="button" data-action="close-sheet" style="border:1.5px solid #dcd3c4;background:transparent;cursor:pointer;border-radius:999px;padding:14px 20px;color:#474238;font:600 14px/1 Figtree,system-ui">Fechar</button>';
      html += '</div></div></div>';
    }

    var app = document.getElementById('app');
    var focusInfo = null;
    var focused = document.activeElement;
    if (focused && focused.id === 'searchInput') {
      focusInfo = { start: focused.selectionStart, end: focused.selectionEnd };
    }
    app.innerHTML = html;

    if (focusInfo) {
      var inp = document.getElementById('searchInput');
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(focusInfo.start, focusInfo.end); } catch (e) {}
      }
    }
    wireSheetDrag();
  }

  function wireSheetDrag() {
    var panel = document.getElementById('sheetPanel');
    if (!panel) return;
    var dragging = false, startY = 0, dy = 0;
    // Listens on window (not pointer capture) so a plain tap on a button inside
    // the sheet still resolves its click to that button, not the panel.
    function onMove(e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      panel.style.transform = 'translateY(' + dy + 'px)';
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (dy > 70) setState({ det: null, sheetY: 0 });
      else { panel.style.transform = 'translateY(0px)'; state.sheetY = 0; }
    }
    panel.addEventListener('pointerdown', function (e) {
      startY = e.clientY; dragging = true; dy = 0;
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  function closeSheet() { setState({ det: null, sheetY: 0 }); }

  document.getElementById('app').addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (el) {
      var action = el.dataset.action;
      if (action === 'pick-day') {
        var idx = +el.dataset.idx;
        setState({ day: idx, tab: 'hoje', det: null, q: '' });
      } else if (action === 'switch-tab') {
        var ti = +el.dataset.idx;
        setState({ tab: live.tabs[ti].id, det: null });
      } else if (action === 'open-item') {
        var bi = +el.dataset.block, ii = +el.dataset.item;
        var it = live.blocks[bi].items[ii];
        var day = DAYS[state.day], city = CITY[CC[state.day]];
        setState({ det: detailFor(it, day, city), sheetY: 0 });
      } else if (action === 'open-next') {
        var day2 = DAYS[state.day], city2 = CITY[CC[state.day]];
        setState({ det: detailFor({ n: live.next.n, d: live.next.d, k: live.next.k }, day2, city2), sheetY: 0 });
      } else if (action === 'search-go') {
        var ri = +el.dataset.idx;
        var r = live.results[ri];
        setState({ day: r.dayIdx, tab: 'hoje', q: '', det: detailFor(r.item, r.dayObj, CITY[CC[r.dayIdx]]), sheetY: 0 });
      } else if (action === 'clear-search') {
        setState({ q: '' });
      } else if (action === 'close-sheet') {
        closeSheet();
      }
      return;
    }
    if (e.target.id === 'sheetBackdrop') closeSheet();
  });

  document.getElementById('app').addEventListener('input', function (e) {
    if (e.target.id === 'searchInput') setState({ q: e.target.value });
  });

  render();
})();
</script>
</body>
</html>
