  // correções feitas ao itinerário original (o utilizador nunca edita estes
  // campos diretamente, só nota, posição e eliminação). Devolve se mudou algo.
  function syncItemContent() {
    var changed = false;
    DATA.forEach(function (day) {
      day.blocks.forEach(function (b) {
        b.items.forEach(function (it) {
          var seed = SEED_LOOKUP[it.uid];
          if (!seed) return;
          if (it.n !== seed.n || (it.d || '') !== (seed.d || '') || (it.t || '') !== (seed.t || '') || it.k !== seed.k || (it.url || '') !== (seed.url || '')) {
            it.n = seed.n; it.d = seed.d; it.t = seed.t; it.k = seed.k; it.url = seed.url;
            changed = true;
          }
        });
      });
    });
    return changed;
  }

  // Repara itinerários gravados antes de secções vazias deixarem de ser
  // removidas: volta a criar (vazias) as secções originais que tenham
  // desaparecido por essa razão. Devolve se mudou algo.
  function reconcileBlocks() {
    var changed = false;
    DATA.forEach(function (day, i) {
      var seedDay = DAYS[i];
      if (!seedDay) return;
      seedDay.blocks.forEach(function (sb) {
        var exists = day.blocks.some(function (b) { return b.label === sb.label; });
        if (!exists) { day.blocks.push({ label: sb.label, items: [] }); changed = true; }
      });
      if (changed) day.blocks.sort(function (a, b) { return BLOCK_ORDER.indexOf(a.label) - BLOCK_ORDER.indexOf(b.label); });
    });
    return changed;
  }

  if (SYNC_DOC) {
    SYNC_DOC.onSnapshot(function (snap) {
      if (snap.exists) {
        var remote = snap.data();
        if (remote && Array.isArray(remote.days) && remote.days.length) DATA = remote.days;
      } else {
        persist();
      }
      var changedA = syncItemContent();
      var changedB = reconcileBlocks();
      if (changedA || changedB) persist();
      render();
    }, function (err) {
      console.error('Erro de sincronização do itinerário', err);
    });
  }

  function findItem(uid) {
    for (var i = 0; i < DATA.length; i++) {
      for (var j = 0; j < DATA[i].blocks.length; j++) {
        var items = DATA[i].blocks[j].items;
        for (var k = 0; k < items.length; k++) if (items[k].uid === uid) return { di: i, bi: j, ii: k, item: items[k] };
      }
    }
    return null;
  }
  function moveItem(uid, target) {
    var loc = findItem(uid);
    if (!loc || loc.di === target) return;
    var label = DATA[loc.di].blocks[loc.bi].label;
    var it = DATA[loc.di].blocks[loc.bi].items.splice(loc.ii, 1)[0];
    var tb = null;
    for (var x = 0; x < DATA[target].blocks.length; x++) if (DATA[target].blocks[x].label === label) { tb = DATA[target].blocks[x]; break; }
    if (!tb) {
      tb = { label: label, items: [] };
      DATA[target].blocks.push(tb);
      DATA[target].blocks.sort(function (a, b) { return BLOCK_ORDER.indexOf(a.label) - BLOCK_ORDER.indexOf(b.label); });
    }
    tb.items.push(it);
    persist();
    state.day = target;
    render();
  }
  var undoTimer = null;
  function deleteItem(uid) {
    var loc = findItem(uid);
    if (!loc) return;
    var label = DATA[loc.di].blocks[loc.bi].label;
    var removed = DATA[loc.di].blocks[loc.bi].items.splice(loc.ii, 1)[0];
    persist();
    state.det = null; state.sheetY = 0;
    state.undo = { day: loc.di, label: label, item: removed, itemIndex: loc.ii };
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () { state.undo = null; render(); }, 6000);
    render();
  }
  function undoDelete() {
    var u = state.undo;
    if (!u) return;
    clearTimeout(undoTimer);
    var day = DATA[u.day];
    if (!day) { state.undo = null; render(); return; }
    var blk = null;
    for (var x = 0; x < day.blocks.length; x++) if (day.blocks[x].label === u.label) { blk = day.blocks[x]; break; }
    if (!blk) {
      blk = { label: u.label, items: [] };
      day.blocks.push(blk);
      day.blocks.sort(function (a, b) { return BLOCK_ORDER.indexOf(a.label) - BLOCK_ORDER.indexOf(b.label); });
    }
    var insertAt = Math.min(u.itemIndex, blk.items.length);
    blk.items.splice(insertAt, 0, u.item);
    persist();
    state.undo = null;
    render();
  }

  // ── geocodificação para o mapa do dia (OpenStreetMap Nominatim, com cache) ─
  var GEOCACHE_KEY = 'japao.geocode.v1';
  var geocache = (function () {
    try { return JSON.parse(window.localStorage.getItem(GEOCACHE_KEY) || '{}'); } catch (e) { return {}; }
  })();
  function saveGeocache() { try { window.localStorage.setItem(GEOCACHE_KEY, JSON.stringify(geocache)); } catch (e) {} }
  var geoQueue = Promise.resolve();
  function geocodePlace(query) {
    if (geocache[query]) return Promise.resolve(geocache[query]);
    var p = geoQueue.then(function () {
      return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q=' + encodeURIComponent(query))
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (arr) {
          if (arr && arr[0]) {
            var loc = [parseFloat(arr[0].lat), parseFloat(arr[0].lon)];
            geocache[query] = loc; saveGeocache();
            return loc;
          }
          return null;
        })
        .catch(function () { return null; })
        .then(function (res) { return new Promise(function (resolve) { setTimeout(function () { resolve(res); }, 1100); }); });
    });
    geoQueue = p.catch(function () {});
    return p;

  var state = { tab: 'hoje', day: 0, det: null, q: '', sheetY: 0, tDay: null, undo: null };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

    });

  function buildDays(tab, di) {

  function computeNext(di, blocks, flat, day) {
    var now = new Date();
    var todayISO = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    var todayIdx = ISO.indexOf(todayISO);
    var mins = now.getHours() * 60 + now.getMinutes();
    function toMin(t) {
      var m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
      return m ? (+m[1] * 60 + +m[2]) : null;
    }
    var next = flat[0] || {}, label = 'Primeiro do dia';
    if (todayIdx === di) {
      var upcoming = flat.find(function (it) { var m = toMin(it.t); return m !== null && m > mins; });
      var h = now.getHours();
      var period = h < 10 ? 'Pequeno-almoço' : h < 12 ? 'Manhã' : h < 15 ? 'Almoço' : h < 18.5 ? 'Tarde' : 'Jantar';
      var blk = blocks.find(function (b) { return b.label === period; }) || blocks.find(function (b) { return b.label === 'Noite'; });
      if (upcoming) { next = upcoming; label = 'A seguir · ' + upcoming.t; }
      else if (blk && blk.items.length) { next = blk.items[0]; label = 'Agora · ' + blk.label.toLowerCase(); }
      else { next = flat[flat.length - 1] || next; label = 'Último do dia'; }
    } else if (todayIdx === -1) {
      var dd = Math.round((new Date(ISO[di]) - new Date(todayISO)) / 86400000);
      label = dd > 0 ? 'Faltam ' + dd + ' dias · começa por' : 'Primeiro do dia';
    }
    return { item: next, label: label };
  }

  function searchResults(q) {
    q = (q || '').trim().toLowerCase();
    if (q.length < 2) return [];
    var out = [];
    DATA.forEach(function (d, i) {
      d.blocks.forEach(function (b) {
        b.items.forEach(function (it) {
          if ((it.n + ' ' + (it.d || '') + ' ' + d.city + ' ' + d.date).toLowerCase().indexOf(q) !== -1) {
            out.push({ n: it.n, where: 'Dia ' + d.n + ' · ' + d.date + ' · ' + b.label, dot: DOT_A[it.k] || '#5F9A85', dayIdx: i, uid: it.uid });

    var el = document.getElementById('mainScroll');
    if (!el) return;
    function onStart(x, y) { swipeX = x; swipeY = y; swipeMoved = false; }
    function onMove(x, y) {
      if (swipeX == null) return;
      if (Math.abs(x - swipeX) > 10 || Math.abs(y - swipeY) > 10) swipeMoved = true;
    }
    function onEnd(x, y) {
      if (swipeX == null) return;
      var dx = x - swipeX, dy = y - swipeY;
      swipeX = null;
      if (state.tab !== 'hoje' || state.det) return;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      var next = state.day + (dx > 0 ? -1 : 1);
      if (next >= 0 && next < DATA.length) setState({ day: next });
    }
    if ('ontouchstart' in window) {
      el.addEventListener('touchstart', function (e) { var t = e.touches[0]; onStart(t.clientX, t.clientY); }, { passive: true });
      el.addEventListener('touchmove', function (e) { var t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
      el.addEventListener('touchend', function (e) { var t = e.changedTouches[0]; onEnd(t.clientX, t.clientY); });
      el.addEventListener('touchcancel', function () { swipeX = null; });
    } else {
      el.addEventListener('pointerdown', function (e) { onStart(e.clientX, e.clientY); });
      el.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
      el.addEventListener('pointerup', function (e) { onEnd(e.clientX, e.clientY); });
      el.addEventListener('pointercancel', function () { swipeX = null; });
    }
  }

    var app = document.getElementById('app');

  function renderDayMap(stops, city) {
    var container = document.getElementById('dayMap');
    if (!container) return;
    if (mapInstance) { try { mapInstance.remove(); } catch (e) {} mapInstance = null; }
    var myToken = ++mapToken;
    var statusEl = document.getElementById('mapStatus');

    if (!window.L) {
      if (statusEl) statusEl.innerHTML = '<span style="font:500 11.5px/1 ui-monospace,Menlo,monospace;color:#56633f;background:#f9f4ed;border-radius:999px;padding:8px 14px">mapa precisa de internet</span>';
      return;
    }

    var map = L.map(container, { zoomControl: true, attributionControl: true }).setView([35.68, 139.76], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(map);
    mapInstance = map;

    if (!stops.length) {
      if (statusEl) statusEl.innerHTML = '<span style="font:500 11.5px/1 ui-monospace,Menlo,monospace;color:#56633f;background:#f9f4ed;border-radius:999px;padding:8px 14px">sem localizações</span>';
      return;
    }

    var bounds = [];
    var polyline = null;
    var pending = stops.length;
    var anyFound = false;

    stops.forEach(function (s) {
      geocodePlace(s.query + ' Japan').then(function (loc) {
        if (myToken !== mapToken) return;
        pending--;
        if (loc) {
          anyFound = true;
          var icon = L.divIcon({
            className: '',
            html: '<div style="width:26px;height:26px;border-radius:999px;background:' + city.deep + ';color:#fff;display:flex;align-items:center;justify-content:center;font:700 12px/1 Figtree,system-ui;box-shadow:0 1px 3px rgba(0,0,0,.35)">' + s.i + '</div>',
            iconSize: [26, 26], iconAnchor: [13, 13]
          });
          var marker = L.marker(loc, { icon: icon }).addTo(map);
          marker.on('click', function () { window.open(mapsUrl(s.rawName), '_blank', 'noopener'); });
          bounds.push(loc);
          if (bounds.length > 1) {
            if (!polyline) polyline = L.polyline(bounds.slice(), { color: city.deep, weight: 3, opacity: .55, dashArray: '2,8' }).addTo(map);
            else polyline.setLatLngs(bounds);
          }
          map.fitBounds(bounds, { padding: [28, 28], maxZoom: 15 });
        }
        if (pending === 0) {
          var st = document.getElementById('mapStatus');
          if (st) {
            if (anyFound) st.remove();
            else st.innerHTML = '<span style="font:500 11.5px/1 ui-monospace,Menlo,monospace;color:#56633f;background:#f9f4ed;border-radius:999px;padding:8px 14px">não foi possível localizar os pontos</span>';
          }
        }
      });
    });
  }

  // Arrastar um cartão (pelo ícone de grip) para reordenar dentro do dia
  // e, se largado noutra secção, mudar esse item de secção.
  var dragUid = null, dragOriginEl = null, dragGhost = null, dragOffX = 0, dragOffY = 0;
  var dragStartX = 0, dragStartY = 0, dragMoved = false;
  var dragTargetLabel = null, dragBeforeUid = null;
  var autoScrollDir = 0, autoScrollRAF = null;

  function clearDragIndicators() {
    var cards = document.querySelectorAll('#mainScroll .card');
    for (var i = 0; i < cards.length; i++) cards[i].style.boxShadow = '';
    var zones = document.querySelectorAll('#mainScroll [data-empty-block]');
    for (var j = 0; j < zones.length; j++) { zones[j].style.borderColor = ''; zones[j].style.background = ''; }
  }

  function updateDragTarget(x, y) {
    var zones = document.querySelectorAll('#mainScroll [data-empty-block]');
    for (var z = 0; z < zones.length; z++) {
      var zr = zones[z].getBoundingClientRect();
      if (y >= zr.top && y <= zr.bottom) {
        clearDragIndicators();
        zones[z].style.borderColor = '#8c491a';
        zones[z].style.background = 'rgba(140,73,26,.08)';
        dragTargetLabel = zones[z].dataset.emptyBlock;
        dragBeforeUid = null;
        return;
      }
    }
    var cards = document.querySelectorAll('#mainScroll [data-action="open-item"]');
    if (!cards.length) return;
    var best = null, bestDist = Infinity, bestTop = false;
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      var cy = r.top + r.height / 2;
      var d = Math.abs(y - cy);
      if (d < bestDist) { bestDist = d; best = cards[i]; bestTop = y < cy; }
    }
    if (!best) return;
    clearDragIndicators();
    best.style.boxShadow = (bestTop ? 'inset 0 3px 0 0 ' : 'inset 0 -3px 0 0 ') + '#8c491a';
    dragTargetLabel = best.dataset.block;
    if (bestTop) {
      dragBeforeUid = best.dataset.uid;
    } else {
      var blk = null;
      for (var b = 0; b < live.blocks.length; b++) if (live.blocks[b].label === dragTargetLabel) { blk = live.blocks[b]; break; }
      var idx = -1;
      if (blk) for (var j = 0; j < blk.items.length; j++) if (blk.items[j].uid === best.dataset.uid) { idx = j; break; }
      var nxt = (blk && idx > -1) ? blk.items[idx + 1] : null;
      dragBeforeUid = nxt ? nxt.uid : null;
    }
  }

  function autoScroll(y) {
    var el = document.getElementById('mainScroll');
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (y < r.top + 46) autoScrollDir = -1;
    else if (y > r.bottom - 46) autoScrollDir = 1;
    else autoScrollDir = 0;
    if (autoScrollDir && autoScrollRAF == null) {
      var tick = function () {
        if (!autoScrollDir) { autoScrollRAF = null; return; }
        el.scrollTop += autoScrollDir * 12;
        autoScrollRAF = requestAnimationFrame(tick);
      };
      autoScrollRAF = requestAnimationFrame(tick);
    }
  }
  function stopAutoScroll() {
    autoScrollDir = 0;
    if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
  }

  function reorderItem(uid, label, beforeUid) {
    if (!label || beforeUid === uid) return;
    var loc = findItem(uid);
    if (!loc) return;
    var it = DATA[loc.di].blocks[loc.bi].items.splice(loc.ii, 1)[0];
    var tb = null;
    for (var x = 0; x < DATA[loc.di].blocks.length; x++) if (DATA[loc.di].blocks[x].label === label) { tb = DATA[loc.di].blocks[x]; break; }
    if (!tb) {
      tb = { label: label, items: [] };
      DATA[loc.di].blocks.push(tb);
      DATA[loc.di].blocks.sort(function (a, b) { return BLOCK_ORDER.indexOf(a.label) - BLOCK_ORDER.indexOf(b.label); });
    }
    var insertAt = tb.items.length;
    if (beforeUid) {
      for (var y = 0; y < tb.items.length; y++) if (tb.items[y].uid === beforeUid) { insertAt = y; break; }
    }
    tb.items.splice(insertAt, 0, it);
    persist();
    var scrollEl = document.getElementById('mainScroll');
    var scrollPos = scrollEl ? scrollEl.scrollTop : 0;
    render();
    var newScrollEl = document.getElementById('mainScroll');
    if (newScrollEl) newScrollEl.scrollTop = scrollPos;
  }

  function beginDrag(handle, x, y) {
    var card = handle.closest('.card');
    if (!card) return;
    dragUid = handle.dataset.uid;
    dragOriginEl = card;
    dragStartX = x; dragStartY = y; dragMoved = false;
    var r = card.getBoundingClientRect();
    dragOffX = x - r.left; dragOffY = y - r.top;
    var ghost = card.cloneNode(true);
    ghost.style.position = 'fixed';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    ghost.style.width = r.width + 'px';
    ghost.style.margin = '0';
    ghost.style.pointerEvents = 'none';
    ghost.style.zIndex = '300';
    ghost.style.boxShadow = '0 14px 30px rgba(46,43,37,.32)';
    ghost.style.transform = 'scale(1.03) rotate(-1deg)';
    ghost.style.opacity = '0.97';
    document.body.appendChild(ghost);
    dragGhost = ghost;
    card.style.opacity = '0.3';
    document.body.style.userSelect = 'none';
    dragTargetLabel = card.dataset.block;
    dragBeforeUid = dragUid;
  }

  function moveDrag(x, y) {
    if (!dragUid || !dragGhost) return;
    if (Math.abs(x - dragStartX) > 4 || Math.abs(y - dragStartY) > 4) dragMoved = true;
    dragGhost.style.left = (x - dragOffX) + 'px';
    dragGhost.style.top = (y - dragOffY) + 'px';
    updateDragTarget(x, y);
    autoScroll(y);
  }

  function endDrag() {
    if (dragGhost && dragGhost.parentNode) dragGhost.parentNode.removeChild(dragGhost);
    dragGhost = null;
    if (dragOriginEl) dragOriginEl.style.opacity = '';
    clearDragIndicators();
    stopAutoScroll();
    document.body.style.userSelect = '';
    var uid = dragUid, label = dragTargetLabel, beforeUid = dragBeforeUid, moved = dragMoved;
    dragUid = null; dragOriginEl = null; dragTargetLabel = null; dragBeforeUid = null; dragMoved = false;
    if (uid && label && moved) reorderItem(uid, label, beforeUid);
  }

  function wireItemDrag() {
    var handles = document.querySelectorAll('[data-action="drag-handle"]');
    var isTouch = 'ontouchstart' in window;
    handles.forEach(function (h) {
      if (isTouch) {
        h.addEventListener('touchstart', function (e) {
          e.preventDefault(); e.stopPropagation();
          var t = e.touches[0];
          beginDrag(h, t.clientX, t.clientY);
          function onMove(ev) { ev.preventDefault(); ev.stopPropagation(); var t2 = ev.touches[0]; moveDrag(t2.clientX, t2.clientY); }
          function onEnd(ev) { ev.stopPropagation(); cleanup(); endDrag(); }
          function cleanup() {
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onEnd);
            window.removeEventListener('touchcancel', onEnd);
          }
          window.addEventListener('touchmove', onMove, { passive: false });
          window.addEventListener('touchend', onEnd);
          window.addEventListener('touchcancel', onEnd);
        }, { passive: false });
      } else {
        h.addEventListener('pointerdown', function (e) {
          e.preventDefault(); e.stopPropagation();
          beginDrag(h, e.clientX, e.clientY);
          function onMove(ev) { ev.stopPropagation(); moveDrag(ev.clientX, ev.clientY); }
          function onEnd(ev) { ev.stopPropagation(); cleanup(); endDrag(); }
          function cleanup() {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onEnd);
            window.removeEventListener('pointercancel', onEnd);
          }
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onEnd);
          window.addEventListener('pointercancel', onEnd);
        });
      }
    });
  }

  function wireSheetDrag() {
    var panel = document.getElementById('sheetPanel');
    if (!panel) return;
    var dragging = false, startY = 0, dy = 0;
    // Listens on window (not pointer capture) so a plain tap on a button inside
    // the sheet still resolves its click to that button, not the panel.
    function onMove(e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      panel.style.transform = 'translateY(' + dy + 'px)';
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
      if (dy > 70) setState({ det: null, sheetY: 0 });
      else { panel.style.transform = 'translateY(0px)'; state.sheetY = 0; }
    }
    panel.addEventListener('pointerdown', function (e) {
      startY = e.clientY; dragging = true; dy = 0;
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  function closeSheet() { setState({ det: null, sheetY: 0 }); }

  document.getElementById('app').addEventListener('click', function (e) {
    if (swipeMoved) { swipeMoved = false; return; }
    var el = e.target.closest('[data-action]');
    if (el) {
      var action = el.dataset.action;
      if (action === 'pick-day') {
        var idx = +el.dataset.idx;
        var d = live.days[idx];
        if (d.ticket) setState({ tDay: state.tDay === d.n ? null : d.n });
        else setState({ day: d.idx, tab: state.tab === 'dias' ? 'hoje' : state.tab, det: null });
      } else if (action === 'switch-tab') {
        var ti = +el.dataset.idx;
        setState({ tab: live.tabs[ti].id, det: null, tDay: null });
      } else if (action === 'open-item') {
        setState({ det: el.dataset.uid, sheetY: 0 });
      } else if (action === 'open-next') {
        setState({ det: live.nextUid, sheetY: 0 });
      } else if (action === 'search-go') {
        setState({ day: +el.dataset.day, tab: 'hoje', q: '', det: el.dataset.uid, sheetY: 0 });
      } else if (action === 'clear-search') {
        setState({ q: '' });
      } else if (action === 'close-sheet') {
        closeSheet();
      } else if (action === 'move-item') {
        moveItem(state.det, +el.dataset.target);
      } else if (action === 'delete-item') {
        deleteItem(state.det);
      } else if (action === 'undo-delete') {
        undoDelete();
      }
      return;
    }
    if (e.target.id === 'sheetBackdrop') closeSheet();
  });

  document.getElementById('app').addEventListener('input', function (e) {
    if (e.target.id === 'searchInput') setState({ q: e.target.value });
  });

  document.getElementById('app').addEventListener('change', function (e) {
    if (e.target.id === 'noteInput') setNote(state.det, e.target.value);
  });

  render();
})();
</script>
</body>
</html>
